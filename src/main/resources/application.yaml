spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  datasource:
    url: jdbc:postgresql://localhost:5432/robo_advisor
    username: robo
    password: password
  jpa:
    hibernate:
      ddl-auto: none

  spring:
    security:
      jwt:
        public-key-location: classpath:keys/public.pem
        private-key-location: classpath:keys/private.pem
        expiration: 3600000